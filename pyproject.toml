[project]
name = "viewhub"
version = "0.1.0"
description = ""
authors = [
    {name = "Mikhail Burdukovsky", email = "burmspb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6 (>=6.11.0,<7.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "playwright (>=1.49.0,<2.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "curl-cffi (>=0.16.3,<0.17.0)",
    "playwright-stealth (>=2.0.3,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.6,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-qt (>=4.5.0,<5.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.ruff]
required-version = ">=0.5.0"

# Папки, которые Ruff вообще не будет сканировать
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "**/migrations/*.py",
    "config/settings.py",
]
line-length = 120

# Настройки линтера (анализатора кода)
[tool.ruff.lint]
select = [
    "E",   # Ошибки стиля кода (pycodestyle errors)
    "W",   # Предупреждения стиля кода (pycodestyle warnings)
    "F",   # Логические ошибки и дефекты (Pyflakes)
    "I",   # Автоматическая сортировка импортов (замена isort)
    "S",   # Проверка безопасности (Bandit) — найдет жестко зашитые пароли
    "B",   # Поиск потенциальных багов и подводных камней (flake8-bugbear)
    "DJ",  # Специфичные правила для Django (flake8-django)
    "RUF", # Собственные полезные правила разработчиков Ruff
]

ignore = [
    "S101",   # Разрешаем использовать assert глобально
    "RUF001", # Игнорировать русскую раскладку в самом коде
    "RUF002", # Игнорировать русскую раскладку в докстрингах
    "RUF003", # Игнорировать русскую раскладку в комментариях (#)
    "I001",   # Игнорировать проблемы с неразрешёнными импортами (для PyQt6)
]

# ЖЕЛЕЗОБЕТОННЫЙ ФИЛЬТР ДЛЯ ТЕСТОВ: Ruff закроет глаза на все специфичные правила в папке tests
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S105",    # Игнорировать предупреждения о "зашитых токенах" (auth_token = "token")
    "S106",    # Игнорировать зашитые пароли в аргументах функций в тестах
    "SLF001",  # Разрешаем приватные вызовы и импорты (_handler, _update_status)
    "PLR2004", # Разрешаем "магические числа" в ассертах тестов (например, assert len(df) == 2)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
pythonpath = [
    ".",               # Корневая папка (чтобы находил parsers_config)
    "src"              # Папка исходников (чтобы импорты внутри src работали напрямую)
]
filterwarnings = [
    "ignore:unclosed database:ResourceWarning"
]
